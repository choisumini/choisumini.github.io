<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Behind the Label — 옷의 라벨을 통해 생산 과정을 추적하는 인터랙티브 페이지">
  <title>BEHIND THE LABEL</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="scroll-story">
      <div class="sticky-screen">
      <header class="section-bar">
        <p class="section-bar__title">BEHIND THE LABEL</p>
      </header>
    <section class="story-panel story-panel--intro" aria-label="프로젝트 소개">
      <div class="panel panel--cream">
        <img class="sweater sweater--intro" src="images/1_sweater.png" alt="옷걸이에 걸린 분홍색 니트 스웨터">
        <h1 class="main-title">BEHIND THE LABEL</h1>
      </div>
    </section>

    <section class="story-panel" aria-label="프로젝트 질문">
      <div class="panel panel--cream panel--prompt">
        <img class="sweater sweater--prompt" src="images/1_sweater.png" alt="분홍색 니트 스웨터">
        <div class="speech-bubble">
          우리는 옷의 라벨만으로<br>
          생산 과정을 어디까지 추적할 수 있을까?
        </div>
      </div>
    </section>

    <section class="story-panel" aria-label="라벨 확인 안내">
      <div class="panel panel--cream panel--prompt">
        <img class="sweater sweater--prompt" src="images/1_sweater.png" alt="분홍색 니트 스웨터" role="button" tabindex="0" aria-label="스웨터를 클릭하여 라벨 확인하기">
        <div class="speech-bubble">
          화면에 있는 옷을 클릭하고 스크롤해서<br>
          옷 안의 라벨을 살펴보자.
        </div>
      </div>
    </section>

    <section class="story-panel story-panel--label" aria-label="의류 라벨 정보">
      <div class="label-panel">
        <img class="label-artwork" src="images/2_label.png" alt="100% Wool, Made in Canada와 취급주의사항이 적힌 의류 라벨">
        <p class="label-caption">
          우리는 옷의 라벨을 통해 일부 정보를 확인할 수 있다.<br>
          그렇다면 이 옷이 만들어진 전체 과정도 알 수 있을까?<br>
          지금부터 의류의 공급망을 추적해보자.
        </p>
      </div>
    </section>
      </div>
    </div>
  </main>
  <script src="js/script.js" defer></script>
</body>
</html>
